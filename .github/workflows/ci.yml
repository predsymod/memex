name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Secret scan
        run: node scripts/check-secrets.mjs --all
      - name: Tests
        working-directory: tests
        run: npm ci && npm test
